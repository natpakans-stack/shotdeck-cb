<style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box}
  body{margin:0;padding:26px 16px 48px;background:#F2EBDD;color:#22201C;
    font:400 15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
  .wrap{max-width:520px;margin:0 auto}
  header{text-align:center;margin-bottom:18px}
  h1{margin:0 0 4px;font-size:19px}
  .sub{margin:0;color:#6A655D;font-size:13.5px}
  .find{display:flex;align-items:center;gap:8px;background:#FCFAF5;border:1px solid #E4DCCB;
    border-radius:12px;padding:10px 13px;margin:0 0 14px}
  .find input{flex:1;border:0;background:none;font:inherit;color:inherit;outline:none;min-width:0}
  .find svg{flex:0 0 16px;opacity:.5}
  .item{display:flex;gap:12px;align-items:center;background:#FCFAF5;border:1px solid #E4DCCB;
    border-radius:14px;padding:11px 13px;margin:0 0 10px;text-decoration:none;color:inherit;
    transition:transform .12s,border-color .12s}
  .item:hover{transform:translateY(-1px);border-color:#C2401F}
  .item img{width:62px;height:62px;flex:0 0 62px;object-fit:cover;border-radius:10px;background:#EFE7D6}
  .item .ph{width:62px;height:62px;flex:0 0 62px;border-radius:10px;background:#EFE7D6}
  .tx{min-width:0}
  .n{display:block;font-weight:600;font-size:14px;line-height:1.42;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .m{display:block;margin-top:4px;color:#6A655D;font-size:12.5px;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .pg{display:flex;justify-content:center;align-items:center;gap:6px;margin:18px 0 0;flex-wrap:wrap}
  .pg button{min-width:34px;min-height:34px;padding:0 10px;border:1px solid #E4DCCB;background:#FCFAF5;
    color:inherit;border-radius:9px;font:inherit;font-size:13px;cursor:pointer}
  .pg button[aria-current=true]{background:#C2401F;border-color:#C2401F;color:#fff}
  .pg button:disabled{opacity:.4;cursor:default}
  .note{margin:22px 0 0;text-align:center;color:#6A655D;font-size:12px;line-height:1.6}
  .empty{text-align:center;color:#6A655D;padding:34px 0}
  @media (prefers-color-scheme:dark){
    body{background:#17150F;color:#F4F0E9}
    .item,.find{background:#201D16;border-color:#33302A}
    .item img,.item .ph{background:#2B2720}
    .sub,.m,.note,.empty{color:#A7A199}
    .pg button{background:#201D16;border-color:#33302A}
  }
</style></head><body><div class="wrap">
  <header><h1>ของที่พูดถึงในคลิป</h1><p class="sub">แกะเรื่องเล่า · Baa-sics</p></header>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="ค้นหาของที่อยากได้…" autocomplete="off" aria-label="ค้นหาสินค้า">

const PER = 8;
const list = document.getElementById('list'), pg = document.getElementById('pg'), q = document.getElementById('q');
let page = 1, hits = ALL;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function draw() {
  const start = (page - 1) * PER, rows = hits.slice(start, start + PER);
  list.innerHTML = rows.length ? rows.map(x =>
    '<a class="item" href="' + esc(x.u) + '" target="_blank" rel="noopener sponsored">' +
      (x.i ? '<img src="' + esc(x.i) + '" alt="" loading="lazy">' : '<span class="ph"></span>') +
      '<span class="tx"><span class="n">' + esc(x.n) + '</span>' +
      '<span class="m">' + esc(x.p) + (x.f ? ' · จากคลิป “' + esc(x.f) + '”' : '') + '</span></span></a>').join('')
    : '<p class="empty">ไม่เจอของที่ค้น ลองคำอื่นดู</p>';
  const pages = Math.max(1, Math.ceil(hits.length / PER));
  pg.innerHTML = pages < 2 ? '' :
    '<button data-go="' + (page - 1) + '"' + (page === 1 ? ' disabled' : '') + ' aria-label="หน้าก่อน">‹</button>' +
    Array.from({length: pages}, (_, i) =>
      '<button data-go="' + (i + 1) + '" aria-current="' + (i + 1 === page) + '">' + (i + 1) + '</button>').join('') +
    '<button data-go="' + (page + 1) + '"' + (page === pages ? ' disabled' : '') + ' aria-label="หน้าถัดไป">›</button>';
}
pg.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (!b || b.disabled) return;
  page = +b.dataset.go; draw(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
q.addEventListener('input', () => { const t = q.value.trim().toLowerCase();
  hits = t ? ALL.filter(x => (x.n + ' ' + x.f).toLowerCase().includes(t)) : ALL; page = 1; draw(); });
draw();
</script></body></html>
